name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, lint, tests et build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: noveris
          POSTGRES_PASSWORD: noveris
          POSTGRES_DB: noveris
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://noveris:noveris@localhost:5432/noveris
      BETTER_AUTH_SECRET: ci-dummy-secret-0123456789abcdefghijklmnop
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_ci_dummy
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier la résolution des dépendances (comme Vercel)
        run: npm install --dry-run

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Vérifier les types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Build
        run: npm run build

      - name: Peupler la base de démonstration
        run: npm run db:seed

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout
        run: npm run test:e2e

      - name: Conserver le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
